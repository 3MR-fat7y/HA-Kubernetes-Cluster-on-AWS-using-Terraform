name: Destroy HA Kubernetes Cluster

on:
  workflow_dispatch:
    inputs:
      aws_region:
        type: choice
        options: ['us-east-1', 'us-west-2', 'eu-central-1']
        default: 'us-west-2'
        description: "AWS region the cluster was deployed in"

jobs:
  destroy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{secrets._AWS_ROLE_}}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: |
          terraform init -upgrade

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve -var="aws_region=${{ inputs.aws_region }}"

      - name: Done
        run: |
          echo "✅ Cluster destroyed — clean slate."
